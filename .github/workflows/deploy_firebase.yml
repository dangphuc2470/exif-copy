name: Build & Distribute APK to Firebase and GitHub Releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    name: Build APK & Upload to Firebase and GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine App Version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            CLEAN_VERSION="${TAG_NAME#v}"
            echo "version_name=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
            echo "release_title=ExifCopy ${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
            CLEAN_LATEST="${LATEST_TAG#v}"
            echo "version_name=${CLEAN_LATEST}-build.${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "release_title=ExifCopy ${CLEAN_LATEST} (Build #${{ github.run_number }})" >> $GITHUB_OUTPUT
            echo "tag_name=latest" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Release APK with Dynamic Version
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            --stacktrace

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: tester
          releaseNotes: "Version ${{ steps.version.outputs.version_name }} (Build #${{ github.run_number }}): ${{ github.event.head_commit.message }}"
          file: app/build/outputs/apk/release/app-release.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.release_title }}
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ### ExifCopy - Release

            ExifCopy is a lightweight Android utility for transferring photo metadata (EXIF) and intelligently merging AI-edited images with their originals.

            #### Build Details
            - Version: `${{ steps.version.outputs.version_name }}`
            - Build Number: `#${{ github.run_number }}`
            - Commit: `${{ github.sha }}`

            #### Requirements
            - Android 7.0 (API level 24) or higher
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
